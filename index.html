<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can You Outsmart AI? | WebLLM Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header>
            <h1>Can you Outsmart AI?</h1>
        </header>
        <div class="status-bar" id="status-bar">Initializing Model</div>
        <div class="chat-window" id="chat-window"></div>

        <div class="input-group">
            <input type="text" id="userinput" placeholder="Enter your Prompt here" disabled>
            <button class="primarybtn" id="sendbtn" disabled>Send</button>
        </div>

        <div class="answer-panel">
            <h3>Submit Secret</h3>
            <div class="input-group" style="margin-bottom: 0;">
                <input type="text" id="secretinput" placeholder="Enter the Secret here">
                <button class="primarybtn" id="answerbtn">Verify</button>
            </div>
            <div id="result" style="margin-top: 10px; font-size: 0.8rem; font-weight: bold;"></div>
        </div>
        <div id="finalscreen" class="resultoverlay hidden">
            <div class="resultcard">
                <h2>Passkey Retrieved!</h2>
                <p>You have successfully outsmarted the AI assistant and retrieved the passkey</p>
                <p>You can brag about it now! 😎</p>
                <button id="popup-close" class="primarybtn">Exit</button>
            </div>
        </div>
    </div>
<script type="module" src="application.js"></script>
</body>
</html>
